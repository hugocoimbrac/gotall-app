name: Build Wear OS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wear/**'
      - '.github/workflows/wear-apk.yml'

jobs:
  build-wear:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Wear OS debug APK
        working-directory: wear
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: GotAll-WearOS
          path: wear/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
